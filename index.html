<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水浒传 · 鲁提辖拳打镇关西</title>
<style>
:root{--ink:#1d1a16;--paper:#d9c9a3;--paper2:#c8b588;--seal:#a3261c;--jade:#2f5d50;--gold:#b88a2e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC","SimSun",serif}
#app{max-width:960px;margin:0 auto;padding:10px}
h1{margin:4px 0 8px;font-size:22px;letter-spacing:.3em;font-weight:700;color:var(--paper)}
h1 small{font-size:14px;letter-spacing:.1em;color:var(--gold);margin-left:10px}
#hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.card{flex:1;min-width:200px;background:#2b261f;border:2px solid var(--gold);padding:6px 10px;border-radius:2px}
.bar{height:10px;background:#111;border:1px solid #000;margin:3px 0 4px}
.bar i{display:block;height:100%;transition:width .4s}
#wrap{position:relative}
canvas{width:100%;display:block;border:3px solid var(--gold);background:#8a7a58;cursor:pointer}
#menu{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:18px;padding:6px 18px;background:var(--seal);color:#f3e6c4;border:2px solid var(--gold);cursor:pointer;letter-spacing:.2em}
button:hover:enabled{filter:brightness(1.2)}
button:disabled{background:#555;color:#999;cursor:not-allowed}
button.on{background:var(--jade);outline:3px solid var(--paper)}
#tip{flex:1;color:var(--gold);font-size:15px}
#log{height:96px;overflow:auto;background:#17140f;border:1px solid #5a4a2a;padding:6px 10px;font-size:15px;line-height:1.6}
#log div:last-child{color:#fff}
#ov{position:absolute;inset:0;background:rgba(20,16,10,.88);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#ov .box{max-width:560px;background:var(--paper);color:#2a2014;border:4px double var(--seal);padding:22px 28px}
#ov h2{margin:0 0 10px;font-size:28px;letter-spacing:.3em;color:var(--seal)}
#ov p{font-size:17px;line-height:1.8;margin:8px 0;text-align:left}
#ov button{margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <h1>水浒传<small>第一回 · 鲁提辖拳打镇关西</small></h1>
  <div id="hud">
    <div class="card">鲁智深 <span id="lh"></span><div class="bar"><i id="lb" style="background:#3e8e6b"></i></div></div>
    <div class="card">镇关西 <span id="bh"></span><div class="bar"><i id="bb" style="background:#b23a2c"></i></div>
      拳 <b id="fc">0</b>/3　脚 <b id="kc">0</b>/2　<span id="turn"></span></div>
  </div>
  <div id="wrap">
    <canvas id="cv" width="720" height="480"></canvas>
    <div id="ov"><div class="box" id="ovb"></div></div>
  </div>
  <div id="menu">
    <button id="bF">拳击</button><button id="bK">脚踢</button><button id="bW">待机</button>
    <span id="tip"></span>
  </div>
  <div id="log"></div>
</div>
<script>
const T=60,W=12,H=8,cv=document.getElementById('cv'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FIST=16,KICK=26,BOSSHP=100;
const OBS={};
[[3,1,'摊'],[4,1,'摊'],[3,6,'摊'],[4,6,'摊'],[6,3,'箱'],[6,4,'箱'],[10,1,'肉'],[11,1,'肉'],[1,1,'井'],[8,7,'箱'],[0,6,'树']]
  .forEach(([x,y,c])=>OBS[x+','+y]=c);
let U,phase,moved,mode,range,fx,fist,kick,busy;

function init(){
  U=[
    {n:'鲁智深',c:'鲁',x:1,y:4,hp:180,max:180,side:0,col:'#2f5d50',dmg:0},
    {n:'镇关西',c:'郑',x:10,y:3,hp:BOSSHP,max:BOSSHP,side:1,col:'#a3261c',dmg:12,boss:1},
    {n:'伙计甲',c:'伙',x:8,y:2,hp:30,max:30,side:1,col:'#6b5a3a',dmg:8},
    {n:'伙计乙',c:'伙',x:8,y:5,hp:30,max:30,side:1,col:'#6b5a3a',dmg:8}];
  fist=0;kick=0;moved=false;mode=null;fx=[];busy=false;phase='player';
  $('log').innerHTML='';
  log('鲁提辖路见不平，要为金家父女讨个公道。');
  startTurn();
}
function log(t){const d=document.createElement('div');d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e5}
const alive=s=>U.filter(u=>u.hp>0&&(s===undefined||u.side===s));
const at=(x,y)=>alive().find(u=>u.x===x&&u.y===y);
const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!OBS[x+','+y]&&!at(x,y);
function reach(u,m){
  const d={},q=[[u.x,u.y]];d[u.x+','+u.y]=0;
  while(q.length){const [x,y]=q.shift(),k=d[x+','+y];if(k>=m)continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,kk=a+','+b;
      if(d[kk]===undefined&&free(a,b)){d[kk]=k+1;q.push([a,b])}}}
  return d;
}
const adj=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1;
function startTurn(){
  phase='player';moved=false;mode=null;
  range=reach(U[0],4);ui();
  $('tip').textContent='点击蓝色格子移动，或选择拳击/脚踢攻击相邻敌人。';
}
function ui(){
  const L=U[0],B=U[1];
  $('lh').textContent=L.hp+'/'+L.max;$('lb').style.width=L.hp/L.max*100+'%';
  $('bh').textContent=B.hp+'/'+B.max;$('bb').style.width=B.hp/B.max*100+'%';
  $('fc').textContent=fist;$('kc').textContent=kick;
  $('turn').textContent=phase==='player'?'【我方回合】':'【敌方回合】';
  const p=phase==='player'&&!busy,near=alive(1).some(e=>adj(L,e));
  $('bF').disabled=$('bK').disabled=!(p&&near);$('bW').disabled=!p;
  $('bF').classList.toggle('on',mode==='fist');$('bK').classList.toggle('on',mode==='kick');
}
$('bF').onclick=()=>{mode=mode==='fist'?null:'fist';ui()};
$('bK').onclick=()=>{mode=mode==='kick'?null:'kick';ui()};
$('bW').onclick=()=>endPlayer();
cv.onclick=e=>{
  if(phase!=='player'||busy)return;
  const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  const L=U[0],t=at(x,y);
  if(mode){
    if(t&&t.side===1&&adj(L,t))attack(L,t,mode);
    else $('tip').textContent='请点击相邻的红框敌人。';
    return;
  }
  if(!moved&&range[x+','+y]!==undefined&&!(x===L.x&&y===L.y)){
    L.x=x;L.y=y;moved=true;range={};ui();
    $('tip').textContent=alive(1).some(e=>adj(L,e))?'已移动。选择拳击或脚踢。':'已移动。无相邻敌人，点击待机结束回合。';
  }
};
function hit(t,d,txt){
  t.flash=12;fx.push({x:t.x*T+30,y:t.y*T+10,t:txt||('-'+d),life:50,col:'#ffd'});
}
function attack(L,t,m){
  busy=true;mode=null;range={};
  const d=m==='fist'?FIST:KICK,nm=m==='fist'?'拳':'脚';
  L.lunge={x:t.x-L.x,y:t.y-L.y,f:10};
  setTimeout(()=>{
    if(t.boss){
      if(m==='fist')fist++;else kick++;
      const done=fist>=3&&kick>=2;
      t.hp=done?0:Math.max(1,BOSSHP-FIST*fist-KICK*kick);
      hit(t,d,m==='fist'?'拳 -'+d:'脚 -'+d);
      log(m==='fist'?'鲁智深挥拳砸向镇关西！（'+fist+'/3 拳）':'鲁智深飞起一脚踹中镇关西！（'+kick+'/2 脚）');
      if(!done&&BOSSHP-FIST*fist-KICK*kick<=0)log('镇关西满脸是血，还强撑着一口气！');
    }else{
      t.hp=Math.max(0,t.hp-d);hit(t,d);
      log('鲁智深一'+nm+'打中'+t.n+(t.hp?'。':'，'+t.n+'倒地不起！'));
    }
    ui();
    if(U[1].hp<=0)return setTimeout(()=>finish(true),700);
    setTimeout(endPlayer,600);
  },250);
}
function endPlayer(){
  if(phase!=='player')return;
  phase='enemy';busy=true;mode=null;range={};ui();
  $('tip').textContent='敌人行动中……';
  const es=alive(1);let i=0;
  const next=()=>{
    if(i>=es.length)return setTimeout(()=>{busy=false;if(U[0].hp>0)startTurn()},300);
    const e=es[i++];if(e.hp<=0)return next();
    const L=U[0];
    if(!adj(e,L)){
      const d=reach(e,3);let best=null,bs=1e9;
      for(const k in d){const [a,b]=k.split(',').map(Number),s=(Math.abs(a-L.x)+Math.abs(b-L.y))*10+d[k];if(s<bs){bs=s;best=[a,b]}}
      if(best){e.x=best[0];e.y=best[1]}
    }
    setTimeout(()=>{
      if(adj(e,L)){
        e.lunge={x:L.x-e.x,y:L.y-e.y,f:10};
        setTimeout(()=>{L.hp=Math.max(0,L.hp-e.dmg);hit(L,e.dmg);
          log(e.n+(e.boss?'抡起剔骨尖刀砍向鲁智深':'挥拳打向鲁智深')+'，损失'+e.dmg+'点体力。');ui();
          if(L.hp<=0)return setTimeout(()=>finish(false),700);
          setTimeout(next,500)},250);
      }else setTimeout(next,350);
    },450);
  };
  setTimeout(next,400);
}
function finish(win){
  phase='end';ui();
  $('ov').classList.remove('hide');
  $('ovb').innerHTML=win?
   '<h2>胜　利</h2><p>三拳两脚之下，镇关西直挺挺躺在地上，再无动静。</p><p>鲁提辖见出了人命，丢下一句狠话，转身离开了渭州城……</p><p><b>通关评价：</b>'+turnsTxt()+'</p><button onclick="start()">再战一次</button>':
   '<h2>败　北</h2><p>鲁智深体力不支，倒在了市集之中。</p><button onclick="start()">重新挑战</button>';
}
let turns=0;function turnsTxt(){return '拳 '+fist+' 脚 '+kick+'，替天行道，路见不平拔拳相助！'}
function start(){$('ov').classList.add('hide');init()}
function intro(){
  $('ovb').innerHTML='<h2>鲁提辖拳打镇关西</h2>'+
  '<p>渭州市集。卖肉的郑屠人称“镇关西”，霸占金翠莲，又逼她父女偿还虚钱。提辖鲁达听闻，怒火中烧，直奔肉铺而来。</p>'+
  '<p><b>目标：</b>以 <b>3 拳 + 2 脚</b> 击倒镇关西。<br><b>操作：</b>点击蓝色格子移动 → 选“拳击”或“脚踢” → 点击相邻敌人。伙计会拦路，镇关西也会还手，留意体力！</p>'+
  '<button onclick="start()">开　战</button>';
}

/* ---------- render ---------- */
function rr(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function draw(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    rr(x*T,y*T,T,T,(x+y)%2?'#a8966d':'#b3a278');
    if(y===3||y===4)rr(x*T,y*T,T,T,(x+y)%2?'#c2b389':'#cbbd95');
    g.strokeStyle='rgba(60,40,10,.15)';g.strokeRect(x*T,y*T,T,T);
  }
  for(const k in OBS){
    const [x,y]=k.split(',').map(Number),c=OBS[k],px=x*T,py=y*T;
    const col={摊:'#7a3b22',箱:'#6a4e2a',肉:'#8c2a22',井:'#5d6568',树:'#3d5a35'}[c];
    if(c==='井'||c==='树'){g.fillStyle=col;g.beginPath();g.arc(px+30,py+30,24,0,7);g.fill()}
    else{rr(px+3,py+6,T-6,T-14,col);rr(px+3,py+6,T-6,10,c==='肉'?'#e9dcc0':'#c9b27a')}
    g.fillStyle='#f3e6c4';g.font='bold 20px serif';g.textAlign='center';g.fillText(c==='树'?'':c,px+30,py+42);
  }
  g.font='bold 16px serif';g.fillStyle='rgba(60,20,10,.55)';g.fillText('郑家肉铺',10.5*T+0,0.75*T);
  if(phase==='player'&&!busy){
    for(const k in range){const [x,y]=k.split(',').map(Number);if(range[k]>0)rr(x*T+2,y*T+2,T-4,T-4,'rgba(50,110,200,.38)')}
    if(mode)for(const e of alive(1))if(adj(U[0],e)){g.strokeStyle='#f33';g.lineWidth=4;g.strokeRect(e.x*T+3,e.y*T+3,T-6,T-6);g.lineWidth=1}
  }
  for(const u of alive()){
    let px=u.x*T+30,py=u.y*T+28;
    if(u.lunge){const f=u.lunge.f--;const s=Math.sin(f/10*Math.PI)*14;px+=u.lunge.x*s;py+=u.lunge.y*s;if(f<=0)u.lunge=null}
    if(u.flash){u.flash--;px+=(u.flash%2?4:-4)}
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(px,py+22,20,7,0,0,7);g.fill();
    g.fillStyle=u.flash?'#fff':u.col;g.beginPath();g.arc(px,py,u.boss?25:22,0,7);g.fill();
    g.strokeStyle=u.side?'#300':'#e9d28a';g.lineWidth=3;g.stroke();g.lineWidth=1;
    g.fillStyle='#f3e6c4';g.font='bold '+(u.boss?28:24)+'px "KaiTi","STKaiti",serif';g.fillText(u.c,px,py+9);
    rr(u.x*T+8,u.y*T+52,44,5,'#000');rr(u.x*T+8,u.y*T+52,44*u.hp/u.max,5,u.side?'#d44':'#4c9');
  }
  for(const f of fx){f.y-=.6;f.life--;g.globalAlpha=Math.min(1,f.life/20);
    g.font='bold 22px serif';g.fillStyle='#000';g.fillText(f.t,f.x+1,f.y+1);g.fillStyle='#ff5a3c';g.fillText(f.t,f.x,f.y);g.globalAlpha=1}
  fx=fx.filter(f=>f.life>0);
}
(function loop(){if(U)draw();requestAnimationFrame(loop)})();
U=[{hp:0}];U=null;init();$('ov').classList.remove('hide');intro();
</script>
</body>
</html>
